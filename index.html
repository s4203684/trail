<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTrail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      background: #1a1a1a;
      color: #fff;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 24px 20px 16px;
      font-size: 1.2rem;
      font-weight: 700;
      border-bottom: 1px solid #333;
    }

    .sidebar-brand span {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: #888;
      margin-top: 2px;
    }

    .sidebar-section {
      padding: 16px 20px 8px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
    }

    .sidebar-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 20px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.875rem;
      cursor: pointer;
      border-left: 2px solid transparent;
    }
    .sidebar-btn:hover { color: #fff; background: #222; }
    .sidebar-btn.active { color: #fff; border-left-color: #4caf50; background: #1f2e1f; }

    .main {
      margin-left: 220px;
      flex: 1;
      padding: 32px 36px;
      max-width: 860px;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px;
      border: 1px solid #e8e8e4;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 6px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* ── Buttons ── */
    .btn {
      padding: 9px 18px;
      border-radius: 7px;
      border: none;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-green { background: #2d6a4f; color: #fff; }
    .btn-green:hover { background: #245a42; }
    .btn-gray { background: #f0f0ec; color: #333; border: 1px solid #e0e0da; }
    .btn-gray:hover { background: #e4e4e0; }
    .btn-red { background: #fce8e4; color: #c0392b; border: 1px solid #f5c6bf; }
    .btn-red:hover { background: #f8d5d0; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

    /* ── Form fields ── */
    input, textarea, select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fafaf8;
      color: #1a1a1a;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #2d6a4f;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 70px; }
    label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 5px; color: #444; }
    .field { margin-bottom: 14px; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Subject list ── */
    .subject-item {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .subject-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .subject-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .subject-name { font-weight: 600; font-size: 0.95rem; flex: 1; }

    .subject-meta { font-size: 0.78rem; color: #888; }

    /* ── Topic detail ── */
    .where-stopped {
      background: #1a1a1a;
      color: #fff;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .where-stopped .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 6px;
    }

    .where-stopped .value {
      font-size: 1rem;
      line-height: 1.5;
    }

    .where-stopped .next {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
      font-size: 0.875rem;
      color: #4caf50;
    }

    .where-stopped .next strong {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 3px;
    }

    /* ── Topic list items ── */
    .topic-item {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topic-name { flex: 1; font-size: 0.9rem; font-weight: 500; }

    .topic-status {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    .s-todo     { background: #f0f0ec; color: #666; }
    .s-doing    { background: #e4f0f8; color: #1d5f8a; }
    .s-done     { background: #d8f3dc; color: #2d6a4f; }
    .s-stuck    { background: #fce8e4; color: #c0392b; }

    .topic-note {
      font-size: 0.78rem;
      color: #999;
      font-style: italic;
      margin-top: 3px;
    }

    /* ── History log ── */
    .log-entry {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.875rem;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-date { font-size: 0.72rem; color: #aaa; margin-bottom: 3px; }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 1.1rem; margin-bottom: 20px; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #aaa;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-text { font-size: 0.9rem; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #1a1a1a;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }

    /* ── Back button ── */
    .back-btn {
      background: none;
      border: none;
      font-size: 0.875rem;
      color: #888;
      cursor: pointer;
      padding: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .back-btn:hover { color: #1a1a1a; }

    /* ── Status select ── */
    select.status-sel {
      width: auto;
      padding: 4px 28px 4px 10px;
      font-size: 0.78rem;
    }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    @media (max-width: 600px) {
      .sidebar { width: 180px; }
      .main { margin-left: 180px; padding: 20px 16px; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      StudyTrail
      <span id="sb-name">Student</span>
    </div>
    <div class="sidebar-section">Subjects</div>
    <div id="sb-subjects"></div>
    <div class="sidebar-section">More</div>
    <button class="sidebar-btn" onclick="showPage('history')">📋 History</button>
    <button class="sidebar-btn" onclick="showPage('settings')">⚙ Settings</button>
  </nav>

  <!-- Main -->
  <main class="main">

    <!-- ── SUBJECTS PAGE ── -->
    <div class="page active" id="page-subjects">
      <div class="page-header">
        <div class="page-title">My Subjects</div>
        <button class="btn btn-green" onclick="openModal('modal-add-subject')">+ Add Subject</button>
      </div>
      <div id="subject-list"></div>
    </div>

    <!-- ── SUBJECT DETAIL PAGE ── -->
    <div class="page" id="page-subject">
      <button class="back-btn" onclick="showPage('subjects')">← Back</button>
      <div class="page-header">
        <div class="page-title" id="detail-title">Subject</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-gray" onclick="openAddTopic()">+ Topic</button>
          <button class="btn btn-green" onclick="openCheckin()">Update Progress</button>
        </div>
      </div>

      <!-- Where I stopped -->
      <div class="where-stopped" id="where-stopped-card">
        <div class="label">Where I stopped</div>
        <div class="value" id="ws-stopped">Nothing recorded yet</div>
        <div class="next" id="ws-next" style="display:none">
          <strong>Next up</strong>
          <span id="ws-next-text"></span>
        </div>
      </div>

      <!-- Topics -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-weight:600;font-size:0.9rem">Topics</div>
      </div>
      <div id="topic-list"></div>

      <!-- Last session note -->
      <div id="last-session-note" style="display:none;margin-top:16px">
        <div class="card">
          <div class="card-title">Last session notes</div>
          <div id="lsn-text" style="font-size:0.875rem;color:#555;line-height:1.6"></div>
        </div>
      </div>
    </div>

    <!-- ── HISTORY PAGE ── -->
    <div class="page" id="page-history">
      <div class="page-title" style="margin-bottom:20px">History</div>
      <div id="history-list"></div>
    </div>

    <!-- ── SETTINGS PAGE ── -->
    <div class="page" id="page-settings">
      <div class="page-title" style="margin-bottom:20px">Settings</div>
      <div class="card">
        <div class="field">
          <label>Your name</label>
          <input id="settings-name" type="text" placeholder="Your name">
        </div>
        <button class="btn btn-green" onclick="saveName()">Save</button>
      </div>
      <div class="card" style="margin-top:12px">
        <div style="font-weight:600;margin-bottom:8px;color:#c0392b">Danger Zone</div>
        <p style="font-size:0.85rem;color:#888;margin-bottom:12px">Delete all data and start fresh.</p>
        <button class="btn btn-red" onclick="resetAll()">Reset Everything</button>
      </div>
    </div>

  </main>
</div>

<!-- ── MODAL: Add Subject ── -->
<div class="overlay" id="modal-add-subject">
  <div class="modal">
    <h2>Add Subject</h2>
    <div class="field">
      <label>Subject name</label>
      <input id="f-subject-name" type="text" placeholder="e.g. Web Development, Java…">
    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeModal('modal-add-subject')">Cancel</button>
      <button class="btn btn-green" onclick="addSubject()">Add</button>
    </div>
  </div>
</div>

<!-- ── MODAL: Add Topic ── -->
<div class="overlay" id="modal-add-topic">
  <div class="modal">
    <h2>Add Topic</h2>
    <div class="field">
      <label>Topic name</label>
      <input id="f-topic-name" type="text" placeholder="e.g. CSS Grid, Arrays, Chapter 3…">
    </div>
    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeModal('modal-add-topic')">Cancel</button>
      <button class="btn btn-green" onclick="addTopic()">Add</button>
    </div>
  </div>
</div>

<!-- ── MODAL: Update Progress (Check-in) ── -->
<div class="overlay" id="modal-checkin">
  <div class="modal">
    <h2>Update Progress</h2>

    <div class="field">
      <label>What did you just work on / where did you stop?</label>
      <textarea id="f-stopped" placeholder="e.g. Finished reading section 4.2, stopped before the exercises…"></textarea>
    </div>

    <div class="field">
      <label>What do you need to do next?</label>
      <textarea id="f-next" placeholder="e.g. Complete exercises on page 74, review CSS specificity…"></textarea>
    </div>

    <div class="field">
      <label>Any notes or things that confused you? <span style="color:#aaa;font-weight:400">(optional)</span></label>
      <textarea id="f-notes" placeholder="e.g. Still unclear on how async/await works inside loops…"></textarea>
    </div>

    <div class="field">
      <label>Topic <span style="color:#aaa;font-weight:400">(optional)</span></label>
      <select id="f-topic-sel">
        <option value="">— General / no specific topic —</option>
      </select>
    </div>

    <div class="field">
      <label>Topic status</label>
      <select id="f-status">
        <option value="">— Don't change —</option>
        <option value="todo">To Do</option>
        <option value="doing">In Progress</option>
        <option value="done">Done</option>
        <option value="stuck">Stuck</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn btn-gray" onclick="closeModal('modal-checkin')">Cancel</button>
      <button class="btn btn-green" onclick="saveCheckin()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}
function save(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function getData() { return load('st2_data', { subjects: [], history: [] }); }
function saveData(d) { save('st2_data', d); }
function getName() { return load('st2_name', ''); }
function saveName2(n) { save('st2_name', n); }

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function ts() { return new Date().toISOString(); }

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-AU', {
    day: 'numeric', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

// ═══════════════════════════════════════════════
//  UI STATE
// ═══════════════════════════════════════════════
let currentSubjectId = null;

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');

  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  if (name === 'history') document.querySelector('[onclick="showPage(\'history\')"]').classList.add('active');
  if (name === 'settings') document.querySelector('[onclick="showPage(\'settings\')"]').classList.add('active');

  if (name === 'subjects') renderSubjects();
  if (name === 'history') renderHistory();
  if (name === 'settings') {
    document.getElementById('settings-name').value = getName();
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.addEventListener('click', e => {
  if (e.target.classList.contains('overlay')) {
    e.target.classList.remove('open');
  }
});

// ═══════════════════════════════════════════════
//  SUBJECTS
// ═══════════════════════════════════════════════
const COLORS = ['#2d6a4f','#1d5f8a','#7b4dbd','#b5651d','#c0392b','#16a085','#8b4513','#555'];

function renderSubjects() {
  const data = getData();
  const list = document.getElementById('subject-list');

  if (data.subjects.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">📚</div>
      <div class="empty-text">No subjects yet.<br>Add your first subject to get started.</div>
    </div>`;
    return;
  }

  list.innerHTML = data.subjects.map(s => {
    const total = s.topics.length;
    const done = s.topics.filter(t => t.status === 'done').length;
    const lastEntry = data.history.filter(h => h.subjectId === s.id).sort((a,b) => new Date(b.at) - new Date(a.at))[0];
    const lastStudied = lastEntry ? fmtDate(lastEntry.at) : 'Never';

    return `<div class="subject-item" onclick="openSubject('${s.id}')">
      <div class="subject-dot" style="background:${COLORS[s.colorIdx % COLORS.length]}"></div>
      <div style="flex:1">
        <div class="subject-name">${esc(s.name)}</div>
        <div class="subject-meta">
          ${total > 0 ? `${done}/${total} topics done · ` : ''}Last studied: ${lastStudied}
        </div>
        ${s.nextTodo ? `<div style="font-size:0.78rem;color:#2d6a4f;margin-top:3px">→ ${esc(s.nextTodo)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function addSubject() {
  const name = document.getElementById('f-subject-name').value.trim();
  if (!name) { toast('Enter a subject name'); return; }

  const data = getData();
  data.subjects.push({
    id: uid(),
    name,
    colorIdx: data.subjects.length,
    topics: [],
    stopped: '',
    nextTodo: '',
    createdAt: ts()
  });
  saveData(data);
  document.getElementById('f-subject-name').value = '';
  closeModal('modal-add-subject');
  renderSubjects();
  buildSidebar();
  toast('Subject added');
}

// ═══════════════════════════════════════════════
//  SUBJECT DETAIL
// ═══════════════════════════════════════════════
function openSubject(id) {
  currentSubjectId = id;
  showPage('subject');
  renderSubjectDetail();

  // Mark active in sidebar
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sb-subject-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
}

function renderSubjectDetail() {
  const data = getData();
  const s = data.subjects.find(s => s.id === currentSubjectId);
  if (!s) { showPage('subjects'); return; }

  document.getElementById('detail-title').textContent = s.name;

  // Where stopped card
  document.getElementById('ws-stopped').textContent = s.stopped || 'Nothing recorded yet';
  const nextEl = document.getElementById('ws-next');
  const nextText = document.getElementById('ws-next-text');
  if (s.nextTodo) {
    nextEl.style.display = 'block';
    nextText.textContent = s.nextTodo;
  } else {
    nextEl.style.display = 'none';
  }

  // Topics
  const topicList = document.getElementById('topic-list');
  if (s.topics.length === 0) {
    topicList.innerHTML = `<div style="color:#aaa;font-size:0.875rem;padding:12px 0">No topics added yet. Topics are optional.</div>`;
  } else {
    topicList.innerHTML = s.topics.map(t => {
      const statusCls = { todo:'s-todo', doing:'s-doing', done:'s-done', stuck:'s-stuck' }[t.status] || 's-todo';
      const statusLabel = { todo:'To Do', doing:'In Progress', done:'Done', stuck:'Stuck' }[t.status] || 'To Do';
      return `<div class="topic-item">
        <div style="flex:1">
          <div class="topic-name">${esc(t.name)}</div>
          ${t.note ? `<div class="topic-note">${esc(t.note)}</div>` : ''}
        </div>
        <select class="status-sel" onchange="changeTopicStatus('${t.id}', this.value)">
          <option value="todo"   ${t.status==='todo'  ?'selected':''}>To Do</option>
          <option value="doing"  ${t.status==='doing' ?'selected':''}>In Progress</option>
          <option value="done"   ${t.status==='done'  ?'selected':''}>Done</option>
          <option value="stuck"  ${t.status==='stuck' ?'selected':''}>Stuck</option>
        </select>
        <button class="btn btn-red btn-sm" style="margin-left:6px" onclick="deleteTopic('${t.id}')">×</button>
      </div>`;
    }).join('');
  }

  // Last session note
  const lastEntry = data.history
    .filter(h => h.subjectId === currentSubjectId)
    .sort((a,b) => new Date(b.at) - new Date(a.at))[0];

  const lsnDiv = document.getElementById('last-session-note');
  if (lastEntry && lastEntry.notes) {
    lsnDiv.style.display = 'block';
    document.getElementById('lsn-text').textContent = lastEntry.notes;
  } else {
    lsnDiv.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════
//  TOPICS
// ═══════════════════════════════════════════════
function openAddTopic() {
  document.getElementById('f-topic-name').value = '';
  openModal('modal-add-topic');
}

function addTopic() {
  const name = document.getElementById('f-topic-name').value.trim();
  if (!name) { toast('Enter a topic name'); return; }

  const data = getData();
  const s = data.subjects.find(s => s.id === currentSubjectId);
  if (!s) return;

  s.topics.push({ id: uid(), name, status: 'todo', note: '' });
  saveData(data);
  closeModal('modal-add-topic');
  renderSubjectDetail();
  toast('Topic added');
}

function changeTopicStatus(topicId, status) {
  const data = getData();
  const s = data.subjects.find(s => s.id === currentSubjectId);
  if (!s) return;
  const t = s.topics.find(t => t.id === topicId);
  if (!t) return;
  t.status = status;
  saveData(data);
  renderSubjectDetail();
  toast('Status updated');
}

function deleteTopic(topicId) {
  if (!confirm('Delete this topic?')) return;
  const data = getData();
  const s = data.subjects.find(s => s.id === currentSubjectId);
  if (!s) return;
  s.topics = s.topics.filter(t => t.id !== topicId);
  saveData(data);
  renderSubjectDetail();
  toast('Topic deleted');
}

// ═══════════════════════════════════════════════
//  CHECK-IN (Update Progress)
// ═══════════════════════════════════════════════
function openCheckin() {
  const data = getData();
  const s = data.subjects.find(s => s.id === currentSubjectId);
  if (!s) return;

  // Pre-fill last stopped
  document.getElementById('f-stopped').value = s.stopped || '';
  document.getElementById('f-next').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-status').value = '';

  // Populate topic dropdown
  const sel = document.getElementById('f-topic-sel');
  sel.innerHTML = '<option value="">— General / no specific topic —</option>' +
    s.topics.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');

  openModal('modal-checkin');
}

function saveCheckin() {
  const stopped = document.getElementById('f-stopped').value.trim();
  const next = document.getElementById('f-next').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const topicId = document.getElementById('f-topic-sel').value;
  const status = document.getElementById('f-status').value;

  if (!stopped && !next) {
    toast('Fill in at least one field');
    return;
  }

  const data = getData();
  const s = data.subjects.find(s => s.id === currentSubjectId);
  if (!s) return;

  // Update subject
  if (stopped) s.stopped = stopped;
  if (next) s.nextTodo = next;

  // Update topic status and note if selected
  if (topicId && status) {
    const t = s.topics.find(t => t.id === topicId);
    if (t) {
      t.status = status;
      if (notes) t.note = notes;
    }
  }

  // Save to history
  data.history.unshift({
    id: uid(),
    subjectId: currentSubjectId,
    subjectName: s.name,
    topicId: topicId || null,
    stopped,
    next,
    notes,
    at: ts()
  });

  // Keep last 200 entries
  if (data.history.length > 200) data.history.length = 200;

  saveData(data);
  closeModal('modal-checkin');
  renderSubjectDetail();
  renderSubjects();
  toast('Progress saved ✓');
}

// ═══════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════
function renderHistory() {
  const data = getData();
  const list = document.getElementById('history-list');

  if (data.history.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-text">No history yet. Update your progress after studying.</div>
    </div>`;
    return;
  }

  list.innerHTML = data.history.map(h => {
    const parts = [];
    if (h.stopped) parts.push(`<div><strong>Stopped at:</strong> ${esc(h.stopped)}</div>`);
    if (h.next) parts.push(`<div style="color:#2d6a4f"><strong>Next:</strong> ${esc(h.next)}</div>`);
    if (h.notes) parts.push(`<div style="color:#888"><strong>Notes:</strong> ${esc(h.notes)}</div>`);

    return `<div class="log-entry">
      <div class="log-date">${fmtDate(h.at)} · <strong>${esc(h.subjectName)}</strong></div>
      <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">${parts.join('')}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════
function buildSidebar() {
  const name = getName();
  document.getElementById('sb-name').textContent = name || 'Student';

  const data = getData();
  const container = document.getElementById('sb-subjects');
  container.innerHTML = data.subjects.map(s => `
    <button class="sidebar-btn sb-subject-btn ${currentSubjectId === s.id ? 'active' : ''}"
      data-id="${s.id}" onclick="openSubject('${s.id}')">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COLORS[s.colorIdx % COLORS.length]};margin-right:8px"></span>
      ${esc(s.name)}
    </button>`).join('');
}

// ═══════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════
function saveName() {
  const name = document.getElementById('settings-name').value.trim();
  saveName2(name);
  buildSidebar();
  toast('Name saved');
}

function resetAll() {
  if (!confirm('Delete everything and start fresh?')) return;
  localStorage.removeItem('st2_data');
  localStorage.removeItem('st2_name');
  location.reload();
}

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════
buildSidebar();
renderSubjects();
</script>
