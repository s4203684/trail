<html>
<head>
    <title>SudyTrail - Carrer Path</title>
    <style>
        header{
        background-color : black;
        color : white;
        padding: 20px;
        border-radius: 12px;
        }

        body{
            background-color: #f5f5f0;
        }

        h2{
            color:  darkgreen;

        }

        #carrer-skills, #carrer-certs, #carrer-resources{
            background-color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 12px;
            
        }

        button{
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        input{
            padding: 8px;
            border: 1.5px solid #ddd;
            border-radius: 7px;
            width: 200px;
        }
    </style>

</head>
    <body>
        <header>
            <h1>Carrer Path</h1>
        </header>
        <div id="carrer-skills">
            <h2>Skils to learn</h2>
            <ul id="skill-list">
                <li>netwoking</li>
                <li>linux system</li>
                <li>active directory</li>
                <li>pentest</li>
            </ul>
            <label for="skill">Enter skill name you want to learn</label><br>
            <input type="text" id="skill" placeholder="e.g Networking...">
            <button type="button" onclick="addSkill()">Add Skill</button>
        </div>
        <div id="carrer-certs">
            <h2>Certificates</h2>
            <ul id="carrer-certificates">
                <li>googlle cyber certificate</li>
                <li>grc certificate</li>
                <li>com ta plus</li>
            </ul>
            <label for="certificate">Add Certificte</label><br>
            <input type="text" name="" id="certificate"  placeholder="e.g GRC Certificate...">
            <button type="button" onclick="addCertificate()">Add Certificate</button>
        </div>
        <div id="carrer-resources">
            <p>Resources to be used</p>
            <ul id="reso">
                <li>www.youtube.com</li>
            </ul>
            <label for="resource">Add Resource</label><br>
            <input type="url" name="" id="resource"  placeholder="e.g Youtube link- www.youtube.com">
            <button type="button" onclick="addResources()">Add Resource</button>

        </div>
        <script>
            function addSkill(){
                let text = document.getElementById("skill").value.trim();
                if (text === ""){
                    alert("Please Enter a Skill");
                    return;
                }

                let list =document.getElementById("skill-list");

                let newItem = document.createElement("li");

                newItem.textContent = text;
                list.appendChild(newItem);
                document.getElementById("skill").value = ""
            }

            function addCertificate(){
                let text = document.getElementById("certificate").value.trim();
                if(text === ""){
                    alert("Enter a Certificate");
                    return;
                }

                let list = document.getElementById("carrer-certificates");
                let newItem = document.createElement("li");

                newItem.textContent = text;
                list.appendChild(newItem);
                document.getElementById("certificate").value = ""
            }

            function addResources(){
                let text = document.getElementById("resource").value.trim();
                if(text === ""){
                    alert("Enter a Resource link/URL");
                    return;
                }

                let list = document.getElementById("reso");
                let newItem = document.createElement("li");

                newItem.textContent = text;
                list.appendChild(newItem);
                document.getElementById("resource").value = ""
            }
        </script>
    </body>
</html>
